# Local PostgreSQL for the rule engine:  docker compose up -d   then   mvn spring-boot:run
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ruleengine
      POSTGRES_USER: ruleengine
      POSTGRES_PASSWORD: ruleengine
    ports:
      - "5432:5432"
    volumes:
      - ruleengine-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruleengine -d ruleengine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ruleengine-data:
