# Database auto-configuration. Every key can be overridden by an environment variable
# (upper-cased, dots -> underscores: db.host -> DB_HOST). Credentials are NEVER stored
# here: supply DB_USERNAME / DB_PASSWORD from the CI secret store.
#
# db.type   postgresql | mysql | mariadb | sqlserver | oracle
# db.url    optional full JDBC URL; when set it wins over type/host/port/name
db.type=postgresql
db.host=localhost
db.port=
db.name=app
db.schema=
