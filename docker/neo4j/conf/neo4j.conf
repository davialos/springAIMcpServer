# ──────────────────────────────────────────────────────────────────────────────
# Neo4j 5 configuration — springAIMcpServerCommon local dev / demo
#
# Tuned for a single-node developer machine (Mac, 16 GB+ RAM recommended).
# Adjust heap sizes for your machine; the defaults below are safe for 8 GB RAM.
# ──────────────────────────────────────────────────────────────────────────────

# ── Network ───────────────────────────────────────────────────────────────────
# Accept Bolt (7687) and HTTP (7474) from any interface so the app container
# and the host browser can both connect.
server.bolt.listen_address=0.0.0.0:7687
server.http.listen_address=0.0.0.0:7474
server.bolt.advertised_address=localhost:7687
server.http.advertised_address=localhost:7474

# Disable HTTPS in the dev container (TLS is terminated at the host/proxy)
server.https.enabled=false

# ── Memory ────────────────────────────────────────────────────────────────────
# Initial and max heap.  For 8 GB host: 512m/1g.  For 16 GB host: 1g/2g.
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1g

# Page cache — holds hot graph data in RAM.  ~25% of available RAM is a good
# starting point for a dev machine.
server.memory.pagecache.size=512m

# ── Vector index ──────────────────────────────────────────────────────────────
# Native vector search for semantic similarity (Neo4j 5.11+).
# Used by Spring AI Neo4jVectorStore for conversation / context embeddings.
# Enabled by default in Neo4j 5 Enterprise and Community ≥ 5.11.
# No extra config needed; indexes are created by the init script.

# ── Logging ───────────────────────────────────────────────────────────────────
server.logs.query.enabled=INFO
server.logs.query.threshold=500ms       # log slow queries
dbms.logs.query.parameter_logging_enabled=false  # never log parameter values

# ── Security ──────────────────────────────────────────────────────────────────
# Allow the browser and REST clients to talk without HTTPS in dev mode.
dbms.security.allow_csv_import_from_file_urls=true
dbms.security.procedures.unrestricted=apoc.*,gds.*

# ── APOC plugin ───────────────────────────────────────────────────────────────
# APOC (Awesome Procedures On Cypher) is bundled via NEO4J_PLUGINS env var.
# These settings whitelist the procedures used by the graph init script.
apoc.export.file.enabled=true
apoc.import.file.enabled=true
apoc.import.file.use_neo4j_config=true
