# Metrics of the two services (Micrometer -> /actuator/prometheus, reachable on the compose network only through the service ports).
global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8091"]
  - job_name: rule-engine-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["rule-engine-service:8092"]
