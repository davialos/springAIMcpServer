spring:
  application:
    name: rule-engine-service
  datasource:
    url: ${RULES_DB_URL:jdbc:postgresql://localhost:5432/dai_store}
    username: ${RULES_DB_USER:dai_app}
    password: ${RULES_DB_PASSWORD:dai_app_secret}
    hikari:
      schema: dynamic_ai
      maximum-pool-size: 12
      connection-timeout: 5000
  flyway:
    # the library's own migrations, applied as the schema owner (the runtime user only needs DML)
    url: ${RULES_DB_URL:jdbc:postgresql://localhost:5432/dai_store}
    user: ${RULES_MIGRATOR_USER:dai_migrator}
    password: ${RULES_MIGRATOR_PASSWORD:dai_migrator_secret}
    enabled: ${RULES_MIGRATE:true}
    locations: classpath:db/dynamic-ai/migration
    schemas: dynamic_ai
    default-schema: dynamic_ai
    table: dai_schema_history
    create-schemas: true
    placeholder-replacement: false
    validate-migration-naming: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
  ai:
    # the Anthropic starter is on the class path but inactive unless SPRING_AI_MODEL_CHAT=anthropic (+ ANTHROPIC_API_KEY)
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_CHAT_MODEL:claude-sonnet-5-5}

server:
  port: ${SERVER_PORT:8092}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # latency heat-maps and p95/p99 in Grafana come from the histogram buckets
      percentiles-histogram:
        http.server.requests: true

# The starter (ADR-0027): persistence unit, agent runtime and the /dynamic-ai chat + admin APIs. This service's own Flyway
# applies the library migrations, so the starter only validates and uses them.
dynamic:
  ai:
    agent:
      environment:
        tier: ${DAI_ENV_TIER:dev}
        application-name: rule-engine-service
      store:
        migrate: false
        validate-schema: true
      scan:
        base-packages: com.example.ruleconsole.assistant
      conversations:
        enabled: true
      security:
        static-role-mappings:
          # only the service's own provisioning identity (a token it signs itself, scope dai.provision) may administer the
          # library; no user token carries a scope
          - source: AUTHORITY
            match-value: SCOPE_dai.provision
            role: PLATFORM_ADMIN

ecosystem:
  assistant:
    enabled: ${ASSISTANT_ENABLED:true}
    # offline = the built-in template assistant (no key needed) | anthropic = a real model
    provider: ${ASSISTANT_PROVIDER:offline}
    model-name: ${ASSISTANT_MODEL_NAME:offline-rule-assistant}
  rules:
    # must equal the auth service's key; >= 32 bytes. Local-stack default only: compose passes it from .env.
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    # DEV | TEST | STAGE | PROD: decides which API environments communication channels may call (LLD-12, LLD-18 §6)
    environment-tier: ${DAI_ENV_TIER:dev}
    poll-interval: PT2S
    max-tenants: 200
    default-language: en
    record-evaluations: true
    max-facts: 200
    max-body-bytes: 262144
