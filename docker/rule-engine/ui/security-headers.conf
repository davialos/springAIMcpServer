# Security headers of the console: ONE owner. nginx includes this file (nginx.conf.template); Vite's dev and preview servers read
# the same file (vite.config.ts), so what is tested in development is what is served. No 'unsafe-eval' and no 'unsafe-inline':
# the protobuf codec is generated static code, and React sets styles through the CSSOM.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
