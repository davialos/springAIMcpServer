# Observability stack for this load-test suite: k6 streams its metrics to Prometheus (remote write), Prometheus
# also scrapes the Spring Boot application's /actuator/prometheus, Grafana shows both on one dashboard.
#   docker compose -f grafana/docker-compose.yml up -d     then   GRAFANA=1 ./run.sh mixed-load
#   open http://localhost:3000 (dashboard "${TITLE}")
# Local use only: Grafana runs with anonymous admin access and both ports are bound to 127.0.0.1.
# Created once by the generator and then yours: edit freely (delete it to get the generated version back).
name: ${COMPOSE_NAME}
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/k6-load-test.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
